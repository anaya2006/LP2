<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Support Chatbot</title>
    <style>
        /* General Layout */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e5ddd5; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }

        #chat-container { 
            width: 400px; 
            height: 600px;
            background: white; 
            border-radius: 15px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.2); 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Section */
        header {
            background: #075e54;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
        }

        header h2 { margin: 0; font-size: 1.2rem; }

        /* Chat Area & Bubbles */
        #chat-box { 
            flex: 1;
            overflow-y: auto; 
            padding: 20px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png'); /* Subtle pattern */
        }

        .bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .user { 
            align-self: flex-end; 
            background-color: #dcf8c6; 
            color: #303030;
            border-bottom-right-radius: 2px;
        }

        .bot { 
            align-self: flex-start; 
            background-color: #ffffff; 
            color: #303030;
            border-bottom-left-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Input Area */
        #input-area { 
            display: flex; 
            padding: 15px; 
            background: #f0f0f0;
        }

        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 25px; 
            outline: none;
        }

        button { 
            background: #075e54; 
            color: white; 
            border: none; 
            padding: 0 15px; 
            margin-left: 10px; 
            border-radius: 50%; 
            cursor: pointer;
            font-size: 1.2rem;
        }

        button:hover { background: #128c7e; }
    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <img src="https://cdn-icons-png.flaticon.com/512/2830/2830284.png" alt="Bank Logo">
        <div>
            <h2>Banking Chatbot</h2>
            <small style="color: #25d366;">● Online</small>
        </div>
    </header>

    <div id="chat-box">
        <div class="bubble bot">Welcome! Type your query below to get started.</div>
    </div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your query..." onkeypress="handleKey(event)">
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    function handleKey(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const message = inputField.value.trim();

        if (!message) return;

        // Display user message bubble
        chatBox.innerHTML += `<div class="bubble user">${message}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });
            const data = await response.json();

            // Display Bot message bubble
            chatBox.innerHTML += `<div class="bubble bot">${data.response}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            chatBox.innerHTML += `<div class="bubble bot">Error connecting to server.</div>`;
        }
    }
</script>

</body>
</html>
